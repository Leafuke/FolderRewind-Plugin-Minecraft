name: Release Plugin v3

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, 1.9.x, 1.11.x]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content MineRewind/manifest.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
            if (-not $tag.StartsWith('v')) { throw "Release tag must use v<SemVer>." }
            $tagVersion = $tag.Substring(1)
            if ($tagVersion -cne $manifestVersion) {
              throw "Tag version '$tagVersion' does not match Manifest '$manifestVersion'."
            }
          }
          "PLUGIN_VERSION=$manifestVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve pinned development contract on 1.11.x
        id: contract
        shell: pwsh
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if ($env:BRANCH -ceq '1.11.x' -and (Test-Path contracts/development-host.txt)) {
            $commit = (Get-Content contracts/development-host.txt -Raw).Trim()
            if ($commit -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full Host SDK source commit.' }
            "commit=$commit" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v4
        if: steps.contract.outputs.commit != ''
        with:
          repository: Leafuke/FolderRewind
          ref: ${{ steps.contract.outputs.commit }}
          path: candidate-host
      - name: Build against exact development SDK
        if: steps.contract.outputs.commit != ''
        shell: pwsh
        run: |
          ./candidate-host/scripts/release/New-DevelopmentPluginContract.ps1 -OutputDirectory artifacts/sdk
          ./tools/Build-Plugin.ps1 -Development -Provenance artifacts/sdk/contract.candidate.json `
            -NuGetConfig artifacts/sdk/NuGet.Config -PackageCache artifacts/sdk/cache -EvidenceDirectory artifacts/test-results
      - name: Build, test and validate published contract
        if: steps.contract.outputs.commit == ''
        shell: pwsh
        run: ./tools/Build-Plugin.ps1 -EvidenceDirectory artifacts/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: MineRewind-frplugin
          path: artifacts/MineRewind-*.frplugin*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MineRewind-test-results
          path: artifacts/test-results
