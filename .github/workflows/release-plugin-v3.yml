name: Release Plugin v3

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, 1.9.x]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content MineRewind/manifest.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
            if (-not $tag.StartsWith('v')) { throw "Release tag must use v<SemVer>." }
            $tagVersion = $tag.Substring(1)
            if ($tagVersion -cne $manifestVersion) {
              throw "Tag version '$tagVersion' does not match Manifest '$manifestVersion'."
            }
          }
          "PLUGIN_VERSION=$manifestVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, test and validate exact package
        shell: pwsh
        run: ./tools/Build-Plugin.ps1 -EvidenceDirectory artifacts/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: MineRewind-frplugin
          path: artifacts/MineRewind-*.frplugin*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MineRewind-test-results
          path: artifacts/test-results
