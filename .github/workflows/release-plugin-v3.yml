name: Release Plugin v3

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content MineRewind/manifest.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
            if (-not $tag.StartsWith('v')) { throw "Release tag must use v<SemVer>." }
            $tagVersion = $tag.Substring(1)
            if ($tagVersion -cne $manifestVersion) {
              throw "Tag version '$tagVersion' does not match Manifest '$manifestVersion'."
            }
          }
          "PLUGIN_VERSION=$manifestVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore
        run: dotnet restore FolderRewind-Plugin-Minecraft.slnx -p:Platform=x64 --configfile NuGet.Config --no-http-cache
      - name: Build
        run: dotnet build FolderRewind-Plugin-Minecraft.slnx --no-restore -c Release -p:Platform=x64
      - name: Test
        run: dotnet test MineRewind.Tests/MineRewind.Tests.csproj --no-restore --no-build -c Release -p:Platform=x64 --logger trx --results-directory artifacts/test-results
      - name: Pack .frplugin
        run: dotnet msbuild MineRewind/MineRewind.csproj /t:PackFrPlugin /p:Configuration=Release /p:Version=${{ env.PLUGIN_VERSION }}
      - name: Reject bundled Abstractions
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/*.frplugin | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            if ($zip.Entries.FullName -match '(^|/)FolderRewind.Plugin.Abstractions.dll$') { throw 'Abstractions DLL is bundled.' }
            $reader = [IO.StreamReader]::new($zip.GetEntry('manifest.json').Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($manifest.architectures -contains 'any') {
              $memory = [IO.MemoryStream]::new()
              $entry = $zip.GetEntry($manifest.entryAssembly).Open()
              try { $entry.CopyTo($memory) } finally { $entry.Dispose() }
              $memory.Position = 0
              $pe = [System.Reflection.PortableExecutable.PEReader]::new($memory)
              try {
                if ($pe.PEHeaders.CoffHeader.Machine -ne [System.Reflection.PortableExecutable.Machine]::I386 -or
                    ($pe.PEHeaders.CorHeader.Flags -band [System.Reflection.PortableExecutable.CorFlags]::Requires32Bit)) {
                  throw 'A plugin declaring any architecture must have a portable entry assembly.'
                }
              } finally { $pe.Dispose(); $memory.Dispose() }
            }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: MineRewind-frplugin
          path: artifacts/MineRewind-*.frplugin*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MineRewind-test-results
          path: artifacts/test-results
